org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Force in-process Kotlin compilation to avoid sandbox restricting kotlin-daemon temp files
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m

# BuildConfig
BUILD_VERSION_NAME=1.0.0
BUILD_VERSION_CODE=1
BUILD_MIN_SDK=24
BUILD_TARGET_SDK=34
BUILD_COMPILE_SDK=34

# HTTP timeouts for large dependency downloads (e.g. sherpa-onnx AAR)
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=600000

# API Config
API_TIMEOUT_CONNECT=10
API_TIMEOUT_READ=30
API_RETRY_COUNT=3
